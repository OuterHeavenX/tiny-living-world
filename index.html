<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Willowbrook">
<title>Tiny Living World — Willowbrook</title>
<style>
:root{
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);
  --sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --glass:rgba(21,39,38,.84);--line:rgba(255,255,255,.16);
  --cream:#e8efd7;--ink:#223b34;--accent:#f2c46d;--muted:rgba(255,255,255,.72);
  --edge:8px;
}
html{touch-action:manipulation;-webkit-text-size-adjust:100%;height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:#172827;color:#fff;font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#scene{position:fixed;inset:0}
#scene canvas{display:block;touch-action:none}
#safeProbe{position:fixed;inset:0;padding:var(--sat) var(--sar) var(--sab) var(--sal);visibility:hidden;pointer-events:none}

button{font:inherit;cursor:pointer;border:0;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:700;min-height:44px;min-width:44px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid #77d3ef;outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
button:active:not(:disabled){transform:scale(.96)}
button.ghost{background:rgba(255,255,255,.1);color:#fff}
button.primary{background:var(--accent);color:#2b2414}
button.danger{background:rgba(214,96,82,.18);color:#ffb3a8;border:1px solid rgba(255,140,120,.35)}
button svg{width:20px;height:20px;flex:none}
.glass{background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;transition:opacity .25s}
#hud>*{pointer-events:auto}
body.mode-title #hud{opacity:0;visibility:hidden}
.pill{position:absolute;display:flex;align-items:center;gap:4px;border-radius:16px;padding:4px}
#clockPill{top:calc(var(--sat) + var(--edge));left:calc(var(--sal) + var(--edge));padding:3px 12px 3px 12px;min-height:46px;flex-direction:column;align-items:flex-start;justify-content:center;gap:0;color:#fff;font:inherit;cursor:pointer}
#clockPill small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
#clockPill small i{font-style:normal;display:inline-block;margin-left:4px;transition:transform .2s}
#clockPill[aria-expanded="true"] small i{transform:rotate(180deg)}
#clock{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
#ctrlPill{top:calc(var(--sat) + var(--edge));right:calc(var(--sar) + var(--edge));padding:3px;gap:3px}
#ctrlPill button{background:rgba(255,255,255,.1);color:#fff;padding:0 10px;font-variant-numeric:tabular-nums}
#speed{min-width:48px}
#dock{bottom:max(10px,calc(var(--sab) + 4px));left:50%;transform:translateX(-50%);transition:transform .25s,opacity .25s;padding:3px;gap:3px}
#dock button{background:rgba(255,255,255,.1);color:#fff;font-size:13px;padding:0 11px;white-space:nowrap}
#dock button svg{width:18px;height:18px}
body.sheet-open #dock,body.sheet-open #ticker{opacity:0;pointer-events:none;transform:translateX(-50%) translateY(20px)}
/* transient news chip: appears when something happens, then fades */
#ticker{all:unset;box-sizing:border-box;position:absolute;left:50%;bottom:calc(max(10px,calc(var(--sab) + 4px)) + 58px);transform:translateX(-50%) translateY(8px);max-width:min(330px,calc(100vw - var(--sal) - var(--sar) - 24px));display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:14px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .35s,transform .35s;background:var(--glass);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;cursor:pointer}
#ticker.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#tickerText{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#feed{position:absolute;top:calc(var(--sat) + var(--edge) + 52px);left:calc(var(--sal) + var(--edge));width:min(320px,calc(100vw - var(--sal) - var(--sar) - 16px));border-radius:16px;padding:10px 12px;font-size:12.5px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:opacity .2s,transform .2s,visibility 0s .2s}
#feed.open{opacity:1;visibility:visible;transform:none;transition:opacity .2s,transform .2s}
#feed strong{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#events{max-height:min(220px,34dvh);overflow:auto;margin-top:4px;-webkit-user-select:text;user-select:text}
#events div{padding:5px 0;border-top:1px solid rgba(255,255,255,.1)}
#hint{position:absolute;top:calc(var(--sat) + var(--edge) + 58px);left:50%;transform:translateX(-50%);font-size:12.5px;padding:7px 12px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .5s;pointer-events:none}
#hint.show{opacity:1}
#toast{position:absolute;top:calc(var(--sat) + var(--edge) + 58px);left:50%;transform:translateX(-50%) translateY(-6px);padding:8px 14px;border-radius:12px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- Resident bottom sheet ---------- */
#sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;width:min(560px,100%);border-radius:20px 20px 0 0;border-bottom:0;padding:4px calc(14px + var(--sar)) calc(12px + var(--sab)) calc(14px + var(--sal));transform:translateY(105%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s .28s}
body.sheet-open #sheet{transform:translateY(0);visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.dragging{transition:none}
#grab{all:unset;display:block;width:100%;height:20px;cursor:grab;touch-action:none}
#grab::after{content:"";display:block;margin:7px auto 0;width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.35)}
.sheet-head{display:flex;align-items:center;gap:8px;touch-action:none}
.sheet-head .who{flex:1;min-width:0}
.sheet-head .who b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-head .who small{color:var(--muted);font-size:12.5px}
.swatch{width:14px;height:14px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.sheet-head button{padding:0 10px}
#sFollow{font-size:13px}
#sFollow[aria-pressed="true"]{background:var(--accent);color:#2b2414}
#sNext,#sClose{background:rgba(255,255,255,.1);color:#fff}
#sActivity{margin:8px 0 6px;font-size:13.5px}
#sActivity span{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{font-size:11.5px;color:var(--muted)}
.stat div{display:flex;justify-content:space-between}
.stat em{font-style:normal;color:#fff;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:#9fd38a;transition:width .4s}
.bar.low i{background:#f0a35e}
#sMemory{margin:8px 0 0;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sMore{display:none;margin-top:8px;font-size:12.5px;max-height:30dvh;overflow:auto}
#sheet.expanded #sMore{display:block}
#sheet.expanded #sMemory{display:none}
#sMore h4{margin:8px 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#sMore ul{margin:0;padding-left:18px}
#sMore li{padding:2px 0}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:calc(var(--sat) + 16px) calc(var(--sar) + 16px) max(16px,calc(var(--sab) + 8px)) calc(var(--sal) + 16px)}
.overlay[hidden]{display:none}
#welcome{background:linear-gradient(to bottom,rgba(23,40,39,0) 30%,rgba(23,40,39,.55) 58%,rgba(23,40,39,.92) 100%)}
.card{width:min(380px,100%);border-radius:22px;padding:20px}
#welcome .card{background:transparent;border:0;-webkit-backdrop-filter:none;backdrop-filter:none;padding:8px 4px;text-align:center}
.brand{margin-bottom:14px;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.brand .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;font-weight:800;color:var(--accent)}
.brand h1{margin:2px 0 4px;font-size:clamp(30px,9vw,40px);line-height:1.05;letter-spacing:-.01em}
.brand p{margin:0;color:rgba(255,255,255,.85);font-size:14px}
.stack{display:flex;flex-direction:column;gap:10px}
.stack button{min-height:52px;font-size:16px;border-radius:14px}
#saveInfo{margin:0 0 2px;font-size:12.5px;color:var(--muted);min-height:1em}
.ver{margin:14px 0 0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#settings{background:rgba(10,20,20,.45);justify-content:flex-end}
@media (min-height:560px) and (min-width:600px){#settings{justify-content:center}}
#settings .card{max-height:100%;overflow:auto}
#settings h2{margin:0;font-size:20px;flex:1}
.set-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:14.5px}
.row label{flex:1}
.row small{display:block;color:var(--muted);font-size:12px}
input[type=range]{width:46%;accent-color:var(--accent);height:32px}
.switch{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:rgba(255,255,255,.2);position:relative;flex:none;cursor:pointer;transition:background .2s;margin:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch:checked{background:#6fbf73}
.switch:checked::after{transform:translateX(20px)}
#settings .stack{margin-top:14px}
#settings .stack button{min-height:46px;font-size:15px}
body:not(.in-game) .ingame-only{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (orientation:landscape) and (max-height:500px){
  #ticker{left:auto;right:calc(var(--sar) + var(--edge));bottom:max(10px,calc(var(--sab) + 4px));transform:translateY(8px);max-width:min(300px,36vw)}
  #ticker.show{transform:none}
  #dock{left:calc(var(--sal) + var(--edge));transform:none}
  body.sheet-open #dock{transform:translateY(20px)}
  .overlay#welcome{justify-content:center;align-items:flex-end;background:linear-gradient(to right,rgba(23,40,39,0) 35%,rgba(23,40,39,.9) 75%)}
  .stack button{min-height:46px}
  .brand{margin-bottom:8px}
  #sMore{max-height:22dvh}
}
</style>
</head>
<body class="mode-title">
<div id="scene"></div>
<div id="safeProbe" aria-hidden="true"></div>

<div id="hud">
  <button id="clockPill" class="pill glass" aria-expanded="false" aria-controls="feed" aria-label="Town happenings"><small>Willowbrook<i aria-hidden="true">▾</i></small><span id="clock">Day 1 · 08:00</span></button>
  <div id="feed" class="glass" aria-hidden="true"><strong>Town happenings</strong><div id="events"></div></div>
  <div id="ctrlPill" class="pill glass">
    <button id="pause" aria-label="Pause">Ⅱ</button>
    <button id="speed" aria-label="Simulation speed">1×</button>
    <button id="menu" aria-label="Menu and settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  </div>
  <div id="hint" class="glass">Drag to orbit · Pinch to zoom · Tap a resident</div>
  <div id="toast" class="glass" role="status"></div>
  <button id="ticker" aria-label="Latest town news — open happenings" tabindex="-1"><span aria-hidden="true">📰</span><span id="tickerText"></span></button>
  <div id="dock" class="pill glass">
    <button id="people" aria-label="Show residents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c.6-3.4 3-5.5 6-5.5s5.4 2.1 6 5.5"/><circle cx="17" cy="9" r="2.6"/><path d="M16.5 14.6c2.4.2 4.1 2 4.5 4.9"/></svg>People</button>
    <button id="resetCam" aria-label="Reset camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="6.5"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></svg>Reset view</button>
    <button id="save" aria-label="Save town"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 4h11l3 3v13H5z"/><path d="M8 4v5h7V4M8 20v-6h8v6"/></svg>Save</button>
  </div>

  <div id="sheet" class="glass" role="dialog" aria-label="Resident details" aria-hidden="true">
    <button id="grab" aria-label="Expand or collapse details"></button>
    <div class="sheet-head" id="sheetHead">
      <span class="swatch" id="sSwatch"></span>
      <div class="who"><b id="sName"></b><small id="sJob"></small></div>
      <button id="sFollow" aria-pressed="false">Follow</button>
      <button id="sNext" aria-label="Next resident">›</button>
      <button id="sClose" aria-label="Close">✕</button>
    </div>
    <p id="sActivity"></p>
    <div class="stats">
      <div class="stat"><div>Energy<em id="sEnergyV"></em></div><div class="bar" id="sEnergyB"><i></i></div></div>
      <div class="stat"><div>Fullness<em id="sHungerV"></em></div><div class="bar" id="sHungerB"><i></i></div></div>
      <div class="stat"><div>Social<em id="sSocialV"></em></div><div class="bar" id="sSocialB"><i></i></div></div>
    </div>
    <p id="sMemory"></p>
    <div id="sMore"><h4>Memories</h4><ul id="sMemList"></ul><h4>Friends</h4><ul id="sFriendList"></ul></div>
  </div>
</div>

<div id="welcome" class="overlay">
  <div class="card">
    <div class="brand">
      <div class="kicker">🌳 Willowbrook</div>
      <h1>Tiny Living World</h1>
      <p>A little town of eight residents, living their lives.</p>
    </div>
    <div class="stack">
      <p id="saveInfo"></p>
      <button id="btnContinue" class="primary">Continue</button>
      <button id="btnNew">New Game</button>
      <button id="btnSettings" class="ghost">Settings</button>
    </div>
    <p class="ver" id="verWelcome">v0.2.0</p>
  </div>
</div>

<div id="settings" class="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="setTitle">
  <div class="card glass">
    <div class="set-head"><h2 id="setTitle">Settings</h2><button id="setClose" class="ghost" aria-label="Close settings">✕</button></div>
    <div class="row"><label for="optSens">Camera sensitivity<small>How fast dragging rotates the view</small></label><input id="optSens" type="range" min="0.5" max="2" step="0.1"></div>
    <div class="row"><label for="optShadows">Shadows<small>Turn off for better battery life</small></label><input id="optShadows" class="switch" type="checkbox"></div>
    <div class="row"><label for="optAutosave">Autosave<small>Every 2 minutes and when you leave</small></label><input id="optAutosave" class="switch" type="checkbox"></div>
    <div class="row"><label for="optHints">Gesture hints<small>Show controls tip when play starts</small></label><input id="optHints" class="switch" type="checkbox"></div>
    <div class="stack">
      <button id="setSave" class="ingame-only">Save town now</button>
      <button id="setTitleBtn" class="ghost ingame-only">Return to title screen</button>
      <button id="setDelete" class="danger">Delete saved town</button>
    </div>
    <p class="ver" id="verSettings">Tiny Living World v0.2.0</p>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';

const GAME_VERSION = '0.2.0';
const SAVE_KEY = 'tlw-save';          // unchanged from v0.1 so existing saves keep working
const SETTINGS_KEY = 'tlw-settings';
const $ = id => document.getElementById(id);
const readJSON = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch { return null; } };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ================= Settings ================= */
const DEFAULT_SETTINGS = { sensitivity: 1, shadows: true, autosave: true, hints: true };
const settings = { ...DEFAULT_SETTINGS, ...(readJSON(SETTINGS_KEY) || {}) };
function writeSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch {} }

/* ================= Scene (unchanged town) ================= */
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xb4def0);
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, .1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
$('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff8dc, 0x637b69, 2));
const sun = new THREE.DirectionalLight(0xfff3cf, 2.1); sun.position.set(-18, 35, 13); sun.castShadow = settings.shadows;
sun.shadow.mapSize.set(1024, 1024); sun.shadow.camera.left = -38; sun.shadow.camera.right = 38; sun.shadow.camera.top = 38; sun.shadow.camera.bottom = -38; scene.add(sun);
const mat = c => new THREE.MeshStandardMaterial({ color: c, roughness: .92 });
const grass = mat(0x91b978), road = mat(0xe5d4b4), trunk = mat(0x9a6a4a), leaf = mat(0x4e9870), skin = mat(0xffcfad);
function cube(w, h, d, c, x, y, z, shadow = true) { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), typeof c === 'number' ? mat(c) : c); m.position.set(x, y, z); m.castShadow = shadow; m.receiveShadow = true; scene.add(m); return m; }
cube(64, .45, 64, grass, 0, -.35, 0, false);
for (const z of [-10, 8]) cube(62, .06, 3.2, road, 0, .01, z, false);
for (const x of [-13, 0, 13]) cube(3, .06, 58, road, x, .02, 0, false);
const sites = [[-20,-20,'Oliver’s Cottage',0xbad2ab],[-7,-20,'Emma’s House',0xe8bbc5],[7,-20,'Sarah’s House',0xb0cbe3],[21,-20,'Shared House',0xc6d4a8],[-20,0,'Sunrise Bakery',0xe8b37e],[-7,0,'Willowbrook Park',0x78b883],[7,0,'Petal & Stem',0xd5abc8],[21,0,'Corner Café',0xc9a991],[7,20,'Town Hall',0xa8b8dc]];
function tree(x, z, scale = 1) { const t = new THREE.Mesh(new THREE.CylinderGeometry(.2, .3, 2, 7), trunk); t.position.set(x, 1, z); scene.add(t); const l = new THREE.Mesh(new THREE.IcosahedronGeometry(1.7 * scale, 1), leaf); l.position.set(x, 2.8, z); l.castShadow = true; scene.add(l); }
sites.forEach(([x, z, name, col], i) => { if (i === 5) { cube(9, .13, 9, 0x75ad66, x, .06, z, false); for (const [dx, dz] of [[-3,-3],[3,-3],[-3,3],[3,3]]) tree(x + dx, z + dz, .8); return; } cube(7, 3.2, 6, col, x, 1.6, z); const roof = new THREE.Mesh(new THREE.ConeGeometry(5.4, 2, 4), mat(i === 4 ? 0xc36d56 : 0xa9655b)); roof.rotation.y = Math.PI / 4; roof.position.set(x, 4.2, z); roof.castShadow = true; scene.add(roof); cube(1.2, 2, .1, 0x785848, x, 1.05, z + 3.07); for (const dx of [-2.2, 2.2]) cube(1.2, 1.15, .12, 0xf9e0a0, x + dx, 2, z + 3.08); });
for (let i = 0; i < 46; i++) { let x = Math.sin(i * 17) * 29, z = Math.cos(i * 11) * 29; if (Math.abs(x) < 24 && Math.abs(z) < 24) continue; tree(x, z, .65 + Math.random() * .5); }

/* ================= Residents (unchanged) ================= */
const data = [['Oliver','Baker',0x4e839a,-20,-20],['Emma','Florist',0xdb7993,-7,-20],['Sarah','Journalist',0x866eb1,7,-20],['Marcus','Mayor',0x627d65,7,20],['Mia','Café owner',0xde9b5b,21,0],['Noah','Mechanic',0x5677b2,21,-20],['Lily','Artist',0xa96d97,-7,0],['Ethan','Job seeker',0x9d854d,7,0]];
const residents = data.map(([name, job, color, x, z], i) => { let g = new THREE.Group(), body = new THREE.Mesh(new THREE.CylinderGeometry(.45, .5, 1.15, 8), mat(color)), head = new THREE.Mesh(new THREE.SphereGeometry(.45, 12, 10), skin); body.position.y = .93; head.position.y = 1.8; g.add(body, head); scene.add(g); g.position.set(x, 0, z); return { name, job, color, g, home: [x, z], dest: [x, z], energy: 70 + Math.random() * 25, social: 40 + Math.random() * 40, hunger: 70 + Math.random() * 20, friendships: {}, memories: [], state: 'Starting the day', next: 0, id: i }; });

// Selection ring (UI affordance only; resident models unchanged)
const ring = new THREE.Mesh(new THREE.RingGeometry(.75, .95, 32), new THREE.MeshBasicMaterial({ color: 0xfff4c2, transparent: true, opacity: .9, depthWrite: false }));
ring.rotation.x = -Math.PI / 2; ring.visible = false; scene.add(ring);

const V3 = THREE.Vector3;
const cam  = { theta: .75, phi: .86, dist: 54, target: new V3() };   // rendered (smoothed)
const want = { theta: .75, phi: .86, dist: 54, target: new V3() };   // desired
let home = { theta: .75, phi: .86, dist: 54, target: new V3() };
const LIMITS = { phiMin: .32, phiMax: 1.3, distMin: 11, distMax: 100, pan: 30 };

let vel = { theta: 0, phi: 0 };   // fling inertia (rad/s)
let atHome = true;                // camera is at the fitted home view
const view = { offX: 0, offY: 0 };

// Points describing the town's buildings and park, used to fit the camera.
const fitPoints = [];
sites.forEach(([x, z], i) => {
  if (i === 5) { for (const sx of [-1, 1]) for (const sz of [-1, 1]) fitPoints.push(new V3(x + sx * 4.6, 0, z + sz * 4.6), new V3(x + sx * 4.4, 4.2, z + sz * 4.4)); return; }

  fitPoints.push(new V3(x, 5.2, z));
});

function safeInsets() { const s = getComputedStyle($('safeProbe')); return { top: parseFloat(s.paddingTop) || 0, right: parseFloat(s.paddingRight) || 0, bottom: parseFloat(s.paddingBottom) || 0, left: parseFloat(s.paddingLeft) || 0 }; }
// Screen area not covered by HUD, in CSS px.
function usableRect(includeSheet) {
  const W = innerWidth, H = innerHeight, s = safeInsets(), pad = 10;
  let top = s.top, bottom = H - s.bottom;
  for (const id of ['clockPill', 'ctrlPill']) { const r = $(id).getBoundingClientRect(); if (r.height) top = Math.max(top, r.bottom); }
  if (document.body.classList.contains('mode-title')) { // frame the town around the title card
    const c = document.querySelector('#welcome .card').getBoundingClientRect();
    let left = s.left, right = W - s.right;
    if (c.height && c.top > H * .3) bottom = Math.min(bottom, c.top + 40); else if (c.width && c.left > W * .3) right = c.left;
    return { left: left + pad, right: right - pad, top: s.top + pad, bottom: bottom - pad };
  }
  const sheetOpen = includeSheet && document.body.classList.contains('sheet-open');
  if (W > H * 1.1 && !sheetOpen) { // landscape: HUD sits in the corners, the town's diamond can use the full height
    return { left: s.left + pad, right: W - s.right - pad, top: s.top + pad + 6, bottom: H - s.bottom - pad };
  }

function viewParams() { const portrait = innerHeight > innerWidth * 1.1; return portrait ? { fov: 58, theta: .32, phi: .6 } : { fov: 46, theta: .75, phi: .86 }; }

function placeCamera(theta, phi, dist, target, offX, offY) {

const _p = new V3();

// Fit the whole town into the usable rect for the current screen.
function computeHome() {
  const p = viewParams(), rect = usableRect(false), [ox, oy] = offsetsFor(rect);
  camera.fov = p.fov; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  const t = new V3();

/* ================= Touch / mouse input ================= */
const canvas = renderer.domElement;
const pointers = new Map();
const ROT = .0065, TAP_SLOP = 9;

function pick(x, y) {
  raycaster.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  const hits = raycaster.intersectObjects(residents.flatMap(r => r.g.children));
  let r = hits.length ? residents.find(r => r.g.children.includes(hits[0].object)) : null;
  if (!r) { // forgiving touch target: nearest resident within 36px
    let best = 36;
    for (const c of residents) { _p.set(c.g.position.x, 1.3, c.g.position.z).project(camera); if (_p.z > 1) continue; const d = Math.hypot((_p.x + 1) / 2 * innerWidth - x, (1 - _p.y) / 2 * innerHeight - y); if (d < best) { best = d; r = c; } }

  if (sessionStarted && settings.autosave) save(true);
  started = false; closeSheet(); setFeed(false); $('ticker').classList.remove('show');
  document.body.classList.add('mode-title'); document.body.classList.remove('in-game');
  $('welcome').hidden = false; refreshTitle(); computeHome(); resetCamera();
  $(sessionStarted || readJSON(SAVE_KEY) ? 'btnContinue' : 'btnNew').focus({ preventScroll: true });
}
function startGame() {
  started = true; sessionStarted = true;
  $('welcome').hidden = true; document.body.classList.remove('mode-title'); document.body.classList.add('in-game');
  computeHome(); resetCamera();
  if (settings.hints) { const h = $('hint'); h.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), 5000); }
}
$('btnContinue').onclick = () => { if (!$('btnContinue').disabled) startGame(); };
$('btnNew').onclick = () => {
  const hasSave = !!readJSON(SAVE_KEY);
  if ((hasSave || sessionStarted) && !confirm('Start a new Willowbrook? Your saved town will be replaced.')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  resetWorld(); paused = false; $('pause').textContent = 'Ⅱ'; startGame();
};
$('btnSettings').onclick = () => openSettings();

function openSettings() {
  settingsOpen = true;
  $('optSens').value = settings.sensitivity; $('optShadows').checked = settings.shadows; $('optAutosave').checked = settings.autosave; $('optHints').checked = settings.hints;
  $('setDelete').disabled = !readJSON(SAVE_KEY);
  $('settings').hidden = false; $('setClose').focus({ preventScroll: true });
}
function closeSettings() { settingsOpen = false; $('settings').hidden = true; if (!started) refreshTitle(); }
$('setClose').onclick = closeSettings;
$('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSettings(); });
$('optSens').oninput = e => { settings.sensitivity = +e.target.value; writeSettings(); };
$('optShadows').onchange = e => { settings.shadows = e.target.checked; sun.castShadow = settings.shadows; writeSettings(); };
$('optAutosave').onchange = e => { settings.autosave = e.target.checked; writeSettings(); };
$('optHints').onchange = e => { settings.hints = e.target.checked; writeSettings(); };
$('setSave').onclick = () => { save(); $('setDelete').disabled = false; };
$('setTitleBtn').onclick = () => { closeSettings(); showTitle(); };
$('setDelete').onclick = () => {
  if (!confirm('Delete your saved Willowbrook town? This can’t be undone.')) return;
  try { localStorage.removeItem(SAVE_KEY); } catch {}
  resetWorld(); sessionStarted = false; closeSettings(); showTitle(); toast('Saved town deleted');
};

document.addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  if (e.key === 'Escape') { if (settingsOpen) closeSettings(); else if ($('feed').classList.contains('open')) setFeed(false); else if (selected) closeSheet(); }
  else if ((e.key === 'r' || e.key === 'R') && started && !settingsOpen) resetCamera();
});

/* ================= Loop, resize, autosave ================= */
let last = performance.now(), acc = 0, sheetTick = 0, autosaveTick = 0, lastClock = '';
function frame(t) {
  requestAnimationFrame(frame);
  const delta = clamp((t - last) / 1000, 0, .1); last = t; // never negative: keeps smoothing stable
  if (started && !paused && !settingsOpen) { acc += delta * speed; while (acc > .12) { step(.12); acc -= .12; } }
  if (!started) want.theta += delta * .05; // gentle idle orbit behind the title screen
  updateCamera(delta);
  sun.position.set(Math.cos(minutes / 1440 * Math.PI * 2) * 30, 10 + Math.sin(minutes / 1440 * Math.PI * 2) * 26, 12);
  sun.intensity = minutes < 360 || minutes > 1200 ? .55 : 2.1;
  scene.background.set(minutes < 360 || minutes > 1200 ? 0x273b57 : 0xb4def0);
  const c = 'Day ' + day + ' · ' + fmtTime(minutes); if (c !== lastClock) { $('clock').textContent = c; lastClock = c; }
  ring.visible = !!selected; if (selected) { ring.position.set(selected.g.position.x, .08, selected.g.position.z); ring.material.opacity = .65 + Math.sin(t / 250) * .25; }
  if (selected && (sheetTick += delta) > .4) { sheetTick = 0; updateSheet(false); }
  if (started && settings.autosave && (autosaveTick += delta) > 120) { autosaveTick = 0; save(true); }
  renderer.render(scene, camera);
}
let resizeQueued = false;
function onResize() {
  if (resizeQueued) return; resizeQueued = true;
  requestAnimationFrame(() => {
    resizeQueued = false;
    renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    const wasHome = atHome; computeHome(); if (wasHome || !started) resetCamera();
  });
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
window.visualViewport?.addEventListener('resize', onResize);
function autosaveNow() { if (sessionStarted && settings.autosave) save(true); }
document.addEventListener('visibilitychange', () => { if (document.hidden) autosaveNow(); });
window.addEventListener('pagehide', autosaveNow);

for (const id of ['verWelcome']) $(id).textContent = 'v' + GAME_VERSION;
$('verSettings').textContent = 'Tiny Living World v' + GAME_VERSION;

computeHome(); resetCamera(true); refreshTitle();
requestAnimationFrame(frame);

// Small read-only hook for automated tests and debugging.
window.__tlw = {
  version: GAME_VERSION, cam, want, LIMITS, view,
  get home() { return home; }, get state() { return { minutes, day, started, paused, speed, follow, selected: selected?.name ?? null, events: events.slice(), atHome }; },
  residents: () => residents.map(r => ({ name: r.name, x: r.g.position.x, z: r.g.position.z, energy: r.energy, hunger: r.hunger, social: r.social })),
  screenOf(i) { const r = residents[i]; _p.set(r.g.position.x, 1.3, r.g.position.z).project(camera); return { x: (_p.x + 1) / 2 * innerWidth, y: (1 - _p.y) / 2 * innerHeight }; },
  townBounds() { return projectedBounds(); }, usableRect: () => usableRect(false), settings,
};
</script>
</body>
