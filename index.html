<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172827"><title>Tiny Living World — Willowbrook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#172827;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}#scene{position:fixed;inset:0}#ui{position:fixed;inset:0;pointer-events:none}button{cursor:pointer;border:0;border-radius:10px;padding:10px 13px;background:#e8efd7;color:#223b34;font-weight:700;min-height:42px}button:focus-visible{outline:3px solid #77d3ef}.hud{position:absolute;pointer-events:auto;background:#182b2ad9;border:1px solid #ffffff35;border-radius:15px;padding:12px;backdrop-filter:blur(9px)}#top{left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;align-items:center;justify-content:space-between;gap:8px}#top small{display:block;opacity:.8}#controls{bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:6px;max-width:calc(100% - 20px)}#controls button{padding:8px;min-width:45px}#panel{right:12px;top:92px;width:min(310px,calc(100vw - 24px));max-height:calc(100dvh - 180px);overflow:auto}#feed{left:12px;bottom:90px;width:min(320px,calc(100vw - 24px));max-height:195px;overflow:auto;font-size:12px}#feed div{padding:5px 0;border-bottom:1px solid #ffffff1a}h3{margin:0 0 8px}#panel p{font-size:13px;line-height:1.5}#panel button{margin:3px}#hint{position:absolute;top:80px;left:12px;font-size:12px;text-shadow:0 1px 4px #000;opacity:.9}@media(max-width:650px){#panel{top:auto;bottom:86px;right:10px;width:min(290px,calc(100vw - 20px))}#feed{display:none}#hint{font-size:11px;max-width:200px}#top{font-size:13px}}
</style></head><body><div id="scene"></div><div id="ui"><div id="top" class="hud"><div><strong>🌳 WILLOWBROOK</strong><small id="clock">Day 1 · 08:00</small></div><small id="status">8 residents living their lives</small></div><div id="hint">Drag to orbit · Pinch to zoom · Tap a resident</div><div id="feed" class="hud"><strong>Town happenings</strong><div id="events"></div></div><div id="panel" class="hud" hidden></div><div id="controls" class="hud"><button id="pause" aria-label="Pause">Ⅱ</button><button id="speed">1×</button><button id="people">People</button><button id="save">Save</button><button id="reset">Reset</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const $=id=>document.getElementById(id), scene=new THREE.Scene();scene.background=new THREE.Color(0xb4def0);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,500),renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff8dc,0x637b69,2));let sun=new THREE.DirectionalLight(0xfff3cf,2.1);sun.position.set(-18,35,13);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-38;sun.shadow.camera.right=38;sun.shadow.camera.top=38;sun.shadow.camera.bottom=-38;scene.add(sun);
const mat=(c)=>new THREE.MeshStandardMaterial({color:c,roughness:.92});const grass=mat(0x91b978),road=mat(0xe5d4b4),trunk=mat(0x9a6a4a),leaf=mat(0x4e9870),skin=mat(0xffcfad);
function cube(w,h,d,c,x,y,z,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='number'?mat(c):c);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;scene.add(m);return m}
cube(64,.45,64,grass,0,-.35,0,false);
for(const z of [-10,8])cube(62,.06,3.2,road,0,.01,z,false);
for(const x of [-13,0,13])cube(3,.06,58,road,x,.02,0,false);
const sites=[[-20,-20,'Oliver’s Cottage',0xbad2ab],[-7,-20,'Emma’s House',0xe8bbc5],[7,-20,'Sarah’s House',0xb0cbe3],[21,-20,'Shared House',0xc6d4a8],[-20,0,'Sunrise Bakery',0xe8b37e],[-7,0,'Willowbrook Park',0x78b883],[7,0,'Petal & Stem',0xd5abc8],[21,0,'Corner Café',0xc9a991],[7,20,'Town Hall',0xa8b8dc]];
function tree(x,z,scale=1){const t=new THREE.Mesh(new THREE.CylinderGeometry(.2,.3,2,7),trunk);t.position.set(x,1,z);scene.add(t);const l=new THREE.Mesh(new THREE.IcosahedronGeometry(1.7*scale,1),leaf);l.position.set(x,2.8,z);l.castShadow=true;scene.add(l)}
sites.forEach(([x,z,name,col],i)=>{if(i===5){cube(9,.13,9,0x75ad66,x,.06,z,false);for(const [dx,dz] of [[-3,-3],[3,-3],[-3,3],[3,3]])tree(x+dx,z+dz,.8);return}cube(7,3.2,6,col,x,1.6,z);const roof=new THREE.Mesh(new THREE.ConeGeometry(5.4,2,4),mat(i===4?0xc36d56:0xa9655b));roof.rotation.y=Math.PI/4;roof.position.set(x,4.2,z);roof.castShadow=true;scene.add(roof);cube(1.2,2,.1,0x785848,x,1.05,z+3.07);for(const dx of [-2.2,2.2])cube(1.2,1.15,.12,0xf9e0a0,x+dx,2,z+3.08);});
for(let i=0;i<46;i++){let x=Math.sin(i*17)*29,z=Math.cos(i*11)*29;if(Math.abs(x)<24&&Math.abs(z)<24)continue;tree(x,z,.65+Math.random()*.5)}
const data=[['Oliver','Baker',0x4e839a,-20,-20],['Emma','Florist',0xdb7993,-7,-20],['Sarah','Journalist',0x866eb1,7,-20],['Marcus','Mayor',0x627d65,7,20],['Mia','Café owner',0xde9b5b,21,0],['Noah','Mechanic',0x5677b2,21,-20],['Lily','Artist',0xa96d97,-7,0],['Ethan','Job seeker',0x9d854d,7,0]];
const residents=data.map(([name,job,color,x,z],i)=>{let g=new THREE.Group(),body=new THREE.Mesh(new THREE.CylinderGeometry(.45,.5,1.15,8),mat(color)),head=new THREE.Mesh(new THREE.SphereGeometry(.45,12,10),skin);body.position.y=.93;head.position.y=1.8;g.add(body,head);scene.add(g);g.position.set(x,0,z);return {name,job,g,home:[x,z],dest:[x,z],energy:70+Math.random()*25,social:40+Math.random()*40,hunger:70+Math.random()*20,friendships:{},memories:[],state:'Starting the day',next:0,id:i};});
const saved=(()=>{try{return JSON.parse(localStorage.getItem('tlw-save')||'null')}catch{return null}})();let minutes=saved?.minutes??480,day=saved?.day??1,speed=1,paused=false,selected=null,follow=false,events=saved?.events??['Welcome to Willowbrook!'];if(saved?.residents)saved.residents.forEach((v,i)=>{const r=residents[i];if(!r||v.name!==r.name)return;r.g.position.set(v.x,0,v.z);r.energy=v.energy;r.social=v.social;r.hunger=v.hunger;r.friendships=v.friendships||{};r.memories=v.memories||[];});
function log(s){events.unshift('Day '+day+': '+s);events=events.slice(0,25);$('events').replaceChildren(...events.slice(0,8).map(t=>{let d=document.createElement('div');d.textContent=t;return d}));}
events.slice().reverse().forEach(()=>{});$('events').replaceChildren(...events.slice(0,8).map(t=>{let d=document.createElement('div');d.textContent=t;return d}));
let theta=.75,phi=.86,dist=54,target=new THREE.Vector3(0,0,0);function placeCamera(){camera.position.set(target.x+dist*Math.sin(phi)*Math.sin(theta),dist*Math.cos(phi)+target.y,target.z+dist*Math.sin(phi)*Math.cos(theta));camera.lookAt(target)}placeCamera();
const canvas=renderer.domElement;let pointers=new Map(),lastPinch=0,moved=0;canvas.style.touchAction='none';canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);moved=0});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;let p=pointers.get(e.pointerId),dx=e.clientX-p[0],dy=e.clientY-p[1];moved+=Math.abs(dx)+Math.abs(dy);pointers.set(e.pointerId,[e.clientX,e.clientY]);if(pointers.size===1){theta-=dx*.007;phi=Math.max(.32,Math.min(1.35,phi-dy*.007));follow=false}else{let ps=[...pointers.values()],d=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);if(lastPinch)dist=Math.max(15,Math.min(95,dist*lastPinch/d));lastPinch=d}});canvas.addEventListener('pointerup',e=>{if(moved<7)pick(e.clientX,e.clientY);pointers.delete(e.pointerId);if(pointers.size<2)lastPinch=0});canvas.addEventListener('wheel',e=>{dist=Math.max(15,Math.min(95,dist+e.deltaY*.03))},{passive:true});
function pick(x,y){let ray=new THREE.Raycaster(),v=new THREE.Vector2(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(v,camera);let hits=ray.intersectObjects(residents.flatMap(r=>r.g.children));if(hits.length){selected=residents.find(r=>r.g.children.includes(hits[0].object));showResident()}}
function showResident(){if(!selected)return;let r=selected,p=$('panel');p.hidden=false;p.replaceChildren();let h=document.createElement('h3');h.textContent=r.name+' · '+r.job;p.append(h);for(const line of ['Activity: '+r.state,'Energy: '+Math.round(r.energy)+'%','Fullness: '+Math.round(r.hunger)+'%','Social: '+Math.round(r.social)+'%','Memory: '+(r.memories[0]||'A fresh start')]){let el=document.createElement('p');el.textContent=line;p.append(el)}let f=document.createElement('button');f.textContent=follow?'Unfollow':'Follow';f.onclick=()=>{follow=!follow;showResident()};let c=document.createElement('button');c.textContent='Close';c.onclick=()=>{p.hidden=true;selected=null;follow=false};p.append(f,c)}
function goal(r){let hour=minutes/60;let opts=hour<7||hour>=22?[r.home]:hour<17?[[...r.home],sites[4].slice(0,2),sites[6].slice(0,2),sites[7].slice(0,2)]:sites.map(s=>s.slice(0,2));if(r.hunger<30)opts=[sites[7].slice(0,2)];r.dest=opts[Math.floor(Math.random()*opts.length)].slice();r.dest[0]+=(Math.random()-.5)*2;r.dest[1]+=(Math.random()-.5)*2;r.state=hour<7||hour>=22?'Going home':r.hunger<30?'Getting food':hour<17?'Working or running errands':'Out exploring';r.next=minutes+20+Math.random()*85}
let lastSocial=0;function step(dt){let old=minutes;minutes+=dt;if(minutes>=1440){minutes-=1440;day++;log('A new day begins.');residents.forEach(r=>r.energy=Math.min(100,r.energy+30))}for(const r of residents){if(minutes>=r.next||minutes<old)goal(r);let dx=r.dest[0]-r.g.position.x,dz=r.dest[1]-r.g.position.z,len=Math.hypot(dx,dz);if(len>.25){let d=Math.min(len,dt*.5);r.g.position.x+=dx/len*d;r.g.position.z+=dz/len*d;r.g.rotation.y=Math.atan2(dx,dz)}r.hunger=Math.max(0,r.hunger-dt*.018);r.energy=Math.max(0,r.energy-dt*.012);if(r.state==='Getting food'&&len<1.5)r.hunger=Math.min(100,r.hunger+dt*.7)}if(Math.abs(minutes-lastSocial)>25){lastSocial=minutes;for(let i=0;i<residents.length;i++)for(let j=i+1;j<residents.length;j++){let a=residents[i],b=residents[j];if(a.g.position.distanceTo(b.g.position)<3&&Math.random()<.23){a.friendships[b.name]=(a.friendships[b.name]||0)+1;b.friendships[a.name]=(b.friendships[a.name]||0)+1;let m=a.name+' chatted with '+b.name;a.memories.unshift(m);b.memories.unshift(m);a.memories=a.memories.slice(0,6);b.memories=b.memories.slice(0,6);log(m);a.social=Math.min(100,a.social+8);b.social=Math.min(100,b.social+8)}}}}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'▶':'Ⅱ'};$('speed').onclick=()=>{speed=speed===1?3:speed===3?10:1;$('speed').textContent=speed+'×'};$('people').onclick=()=>{selected=residents[selected?(selected.id+1)%residents.length:0];showResident()};$('save').onclick=save;
function save(){localStorage.setItem('tlw-save',JSON.stringify({minutes,day,events,residents:residents.map(r=>({name:r.name,x:r.g.position.x,z:r.g.position.z,energy:r.energy,social:r.social,hunger:r.hunger,friendships:r.friendships,memories:r.memories}))}));log('Town saved to this browser.')}
$('reset').onclick=()=>{if(confirm('Reset your saved Willowbrook town?')){localStorage.removeItem('tlw-save');location.reload()}};
let last=performance.now(),acc=0;function frame(t){requestAnimationFrame(frame);let delta=Math.min((t-last)/1000,.1);last=t;if(!paused){acc+=delta*speed;while(acc>.12){step(.12);acc-=.12}}if(follow&&selected)target.lerp(selected.g.position,.06);else target.lerp(new THREE.Vector3(0,0,0),.012);placeCamera();sun.position.set(Math.cos(minutes/1440*Math.PI*2)*30,10+Math.sin(minutes/1440*Math.PI*2)*26,12);sun.intensity=minutes<360||minutes>1200?.55:2.1;scene.background.set(minutes<360||minutes>1200?0x273b57:0xb4def0);$('clock').textContent='Day '+day+' · '+String(Math.floor(minutes/60)).padStart(2,'0')+':'+String(Math.floor(minutes%60)).padStart(2,'0');if(selected&&t%900<17)showResident();renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});requestAnimationFrame(frame);
</script></body></html>
